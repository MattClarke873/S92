<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/navEnd.css">
  <link rel="stylesheet" href="../css/theme.css">
  <style>
body {
  background-image: url("../support_Documents/S92B.jpg");
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed; /* Change to fixed to prevent scrolling */
  height: 100%; /* Set height to 100% */
  width: 100%; /* Set width to 100% */
  margin: 0; /* Remove default margin */

}
  </style>
  <title>MCQ Quiz Week 5</title>
</head>
<body>
  <div class="container">

    <h1>S-92 Week 5</h1>

    <!-- Hidden input to specify aircraft type -->
    <input type="hidden" id="aircraftType" value="S92">

    <div class="selections">
      <div class="setup-row">
        <label class="setup-label" for="questionCount">Questions</label>
        <select id="questionCount">
        <option value="0">0</option>
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="15">15</option>
        <option value="20">20</option>
        <option value="25">25</option>
        <option value="30">30</option>
        <option value="35">35</option>
        <option value="40">40</option>
      </select>
      </div>

      <!-- Checkboxes for categories -->
      <div class="ATAs">
        <div class="SelectionBox">
          <div class="list">
            <ul class="ata_List1">
              <li><label><input type="checkbox" class="category-checkbox" value="21"> 21</label></li>
              <li><label><input type="checkbox" class="category-checkbox" value="30"> 30</label></li>
              <li><label><input type="checkbox" class="category-checkbox" value="76"> 76</label></li>
            </ul>
          </div>
          <div class="list">
            <ul class="ata_List2">
              <li><label><input type="checkbox" class="category-checkbox" value="77"> 77</label></li>
              <li><label><input type="checkbox" class="category-checkbox" value="80"> 80</label></li>
            </ul>
          </div>
        </div>
      </div>
      <div class="selectAllBox">
        <label><input type="checkbox" id="selectAll"> All chapters</label>
      </div>
    </div>

    <div class="bottomButtons">
      <button id="filterBtn">Start quiz</button>
    </div>

    <div id="questions-container"></div>

    <div id="result-container"></div>

    <div class="bottomButtons">
      <button id="finishBtn">Mark answers</button>
      <button id="resetBtn">Clear</button>
    </div>

    <div class="navigation">
      <a href="../html/S92Week4.html"> <button id="left">Week 4</button> </a>
      <a href="../html/S92.html"> <button id="home">S-92 weeks</button></a>
    </div>

  </div>

  <script type="module" src="../js/script.js"></script>
  <script type="module" src="../js/settingsPanel.js"></script>
</body>
</html>
