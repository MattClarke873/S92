<!DOCTYPE html>

<head>

  <style>

      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;

      width: 100%;

  <title>MCQ Quiz Week 3</title>

<body>
  <div class="container">
    <h1>AW139 Week 3</h1>

    <!-- Hidden input to specify aircraft type -->

    <div class="selections">
      <div class="setup-row">
        <label class="setup-label" for="questionCount">Questions</label>
        <select id="questionCount">
        <option value="0">0</option>
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="15">15</option>
        <option value="20">20</option>
        <option value="25">25</option>
        <option value="30">30</option>
        <option value="35">35</option>
        <option value="40">40</option>
      </select>
      </div>

      <!-- Checkboxes for categories -->
      <!-- TODO: Replace placeholder ATA chapters below once Week 3 syllabus is confirmed -->
      <div class="ATAs">
        <div class="SelectionBox">
          <div class="list">
            <ul class="ata_List1">
              <li><label><input type="checkbox" class="category-checkbox" value="67"> 67</label></li>
              <li><label><input type="checkbox" class="category-checkbox" value="30"> 30</label></li>
              <li><label><input type="checkbox" class="category-checkbox" value="28"> 28</label></li>
            </ul>
          </div>
          <div class="list">
            <ul class="ata_List2">
              <li><label><input type="checkbox" class="category-checkbox" value="70" disabled> 70-79</label></li>
              <li><label><input type="checkbox" class="category-checkbox" value="80" disabled> 80</label></li>
            </ul>
          </div>
          <!-- Add more categories as needed -->


    </div>
      </div>
      <div class="selectAllBox">
        <label><input type="checkbox" id="selectAll"> All chapters</label>
      </div>
    </div>
    <div class="bottomButtons">
      <button id="filterBtn">Start quiz</button>
    </div>

    <div id="questions-container"></div>

    <div id="result-container"></div>

    <div class="bottomButtons">
      <button id="finishBtn">Mark answers</button>
      <button id="resetBtn">Clear</button>
    </div>

    <div class="navigation">
      <a href="../html/AW139Week2.html"> <button id="left">Week 2</button> </a>
      <a href="../html/AW139.html"> <button id="home">AW139 weeks</button></a>
      <a href="../html/AW139Week4.html"> <button id="right">Week 4</button> </a>
    </div>
  </div>

  <script type="module" src="../js/script.js"></script>
  <script type="module" src="../js/settingsPanel.js"></script>
